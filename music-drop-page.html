<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />

  <title>مزيكا توتا</title>
  <style>
    body{font-family:Arial,sans-serif;background:#0b0614;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
    .box{max-width:520px;padding:24px;text-align:center}
    .btn{display:inline-block;margin-top:16px;padding:12px 18px;background:#ff4fd8;color:#fff;border-radius:12px;text-decoration:none}
  </style>
</head>
<body>
  <div class="box">
    <h1>مزيكا توتا</h1>
    <p>جاري تحويلك إلى الصفحة الرئيسية...</p>
    <a class="btn" href="mzeeka-tota.html">افتح الآن</a>
  </div>
<script>window.parent.postMessage({ action: "ready" }, "*"); 
 
window.console = new Proxy(console, {
  get(target, prop) {
    if (['log', 'warn', 'error'].includes(prop)) {
      return new Proxy(target[prop], {
        apply(fn, thisArg, args) {
          fn.apply(thisArg, args);
          window.parent.postMessage({ action: 'console', 
            type: prop, 
            args: args.map((arg) => {
              try {
                return JSON.stringify(arg).replace(/^["']|["']$/g, '');
              } catch (e) {
                return arg;
              }
            }) 
          }, '*');
        }
      });
    }
    return target[prop];
  }
});
</script></body>
</html>
